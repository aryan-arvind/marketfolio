[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risklens"
version = "1.0.0"
description = "Real-Data Risk and Macro-Linkage Monitor for Indian Mutual Funds and Equities"
authors = [{ name = "RiskLens Team" }]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "requests>=2.31.0",
    "yfinance>=0.2.40",
    "streamlit>=1.30.0",
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
